<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WHACK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;color:#00ff41;font-family:'Courier New',monospace;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
#hdr{display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:1px solid rgba(0,255,65,.25);flex-shrink:0;}
.hbtn{background:none;border:1px solid rgba(0,255,65,.4);color:#00ff41;
  font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;
  padding:8px 14px;border-radius:4px;cursor:pointer;}
.hbtn:active{background:rgba(0,255,65,.2);}
#sval{font-size:clamp(20px,5vw,34px);font-weight:bold;text-shadow:0 0 10px #00ff41;}
#timer-val{font-size:clamp(18px,4vw,28px);font-weight:bold;color:#ffdd00;text-shadow:0 0 10px #ffdd00;}
#main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);
  width:100%;max-width:420px;}
.hole{aspect-ratio:1;background:rgba(0,255,65,.05);border:2px solid rgba(0,255,65,.2);
  border-radius:50%;position:relative;overflow:hidden;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;}
.mole{position:absolute;bottom:-100%;width:70%;transition:bottom .12s ease-out;
  display:flex;flex-direction:column;align-items:center;}
.mole.up{bottom:0;}
.mole.bonked{bottom:-100%;transition:bottom .08s;}
.mole-head{width:100%;aspect-ratio:1;border-radius:50% 50% 40% 40%;
  background:#00ff41;box-shadow:0 0 16px #00ff41;position:relative;
  display:flex;align-items:center;justify-content:center;}
.mole-eyes{display:flex;gap:20%;width:60%;justify-content:space-between;position:absolute;top:25%;}
.mole-eye{width:18%;aspect-ratio:1;background:#000;border-radius:50%;}
.mole-mouth{position:absolute;bottom:22%;width:40%;height:10%;
  border-radius:0 0 50% 50%;background:#000;}
.mole-body{width:60%;height:20px;background:#00cc33;border-radius:4px 4px 0 0;}
/* special gold mole */
.mole.gold .mole-head{background:#ffdd00;box-shadow:0 0 20px #ffdd00;}
.mole.gold .mole-body{background:#cc9900;}
/* hit flash */
.hole.hit{animation:hflash .15s;}
@keyframes hflash{0%,100%{background:rgba(0,255,65,.05)}50%{background:rgba(0,255,65,.35)}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;}
.ov-t{font-size:clamp(22px,6vw,40px);font-weight:bold;letter-spacing:4px;text-shadow:0 0 18px #00ff41;}
.ov-s{font-size:clamp(12px,2.5vw,16px);opacity:.6;letter-spacing:2px;text-align:center;line-height:1.8;}
.big-btn{background:rgba(0,255,65,.1);border:3px solid #00ff41;color:#00ff41;
  font-family:'Courier New',monospace;font-size:clamp(16px,4vw,24px);font-weight:bold;
  letter-spacing:4px;padding:16px 44px;border-radius:8px;cursor:pointer;
  text-shadow:0 0 10px #00ff41;box-shadow:0 0 18px rgba(0,255,65,.3);}
.big-btn:active{background:rgba(0,255,65,.3);transform:scale(.96);}
.diff-btns{display:flex;gap:12px;}
.diff-btn{background:rgba(0,255,65,.08);border:2px solid rgba(0,255,65,.4);color:#00ff41;
  font-family:'Courier New',monospace;font-size:clamp(12px,2.5vw,16px);letter-spacing:2px;
  padding:10px 18px;border-radius:6px;cursor:pointer;}
.diff-btn.sel{background:rgba(0,255,65,.2);border-color:#00ff41;}
</style>
</head>
<body>
<div id="hdr">
  <button class="hbtn" onclick="location.href='radar_control.html'">RADAR</button>
  <div style="text-align:center">
    <div style="font-size:10px;opacity:.45;letter-spacing:3px">PUNTEGGIO</div>
    <div id="sval">0</div>
  </div>
  <div style="text-align:center">
    <div style="font-size:10px;opacity:.45;letter-spacing:3px">TEMPO</div>
    <div id="timer-val">30</div>
  </div>
  <div style="text-align:right;font-size:11px;opacity:.45">
    REC <span id="hi">0</span>
  </div>
</div>
<div id="main">
  <div id="grid"></div>
</div>
<div id="ov">
  <div class="ov-t">-- WHACK! --</div>
  <div class="ov-s">Tocca le talpe verdi!<br>Oro vale doppio!</div>
  <div class="diff-btns">
    <button class="diff-btn sel" onclick="selDiff(30,this)">FACILE<br><small>30s</small></button>
    <button class="diff-btn" onclick="selDiff(20,this)">MEDIO<br><small>20s</small></button>
    <button class="diff-btn" onclick="selDiff(15,this)">DURO<br><small>15s</small></button>
  </div>
  <button class="big-btn" onclick="startGame()">GIOCA</button>
</div>
<script>
const N=9;
let holes=[],score=0,timeLeft=30,totalTime=30,run=false,gameLoop,timerLoop;
let hi=+localStorage.getItem('wh_hi')||0;
document.getElementById('hi').textContent=hi;

function selDiff(t,btn){
  totalTime=t;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function buildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';holes=[];
  for(let i=0;i<N;i++){
    const hole=document.createElement('div');
    hole.className='hole';
    hole.innerHTML=`<div class="mole" id="mole${i}">
      <div class="mole-head">
        <div class="mole-eyes"><div class="mole-eye"></div><div class="mole-eye"></div></div>
        <div class="mole-mouth"></div>
      </div>
      <div class="mole-body"></div>
    </div>`;
    hole.addEventListener('click',()=>whack(i));
    hole.addEventListener('touchstart',e=>{e.preventDefault();whack(i);},{passive:false});
    grid.appendChild(hole);
    holes.push({el:hole,mole:hole.querySelector('.mole'),up:false,gold:false,timer:null});
  }
}

function startGame(){
  document.getElementById('ov').style.display='none';
  buildGrid();
  score=0; timeLeft=totalTime; run=true;
  document.getElementById('sval').textContent=0;
  document.getElementById('timer-val').textContent=timeLeft;
  clearInterval(timerLoop);
  timerLoop=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer-val').textContent=timeLeft;
    if(timeLeft<=0){endGame();}
  },1000);
  // pop moles
  popRandom();
}

function popRandom(){
  if(!run) return;
  const i=~~(Math.random()*N);
  const h=holes[i];
  if(!h.up){
    h.up=true;
    h.gold=Math.random()<0.15;
    h.mole.classList.toggle('gold',h.gold);
    h.mole.classList.add('up');
    clearTimeout(h.timer);
    const dur=600+Math.random()*700-Math.floor(score/50)*30;
    h.timer=setTimeout(()=>{
      h.mole.classList.remove('up','bonked');
      h.up=false;
    },Math.max(350,dur));
  }
  const next=200+Math.random()*400-Math.floor(score/80)*20;
  setTimeout(popRandom,Math.max(120,next));
}

function whack(i){
  if(!run) return;
  const h=holes[i];
  if(!h.up) return;
  const pts=h.gold?20:10;
  score+=pts;
  document.getElementById('sval').textContent=score;
  h.mole.classList.remove('up');
  h.mole.classList.add('bonked');
  h.up=false;
  clearTimeout(h.timer);
  h.el.classList.add('hit');
  setTimeout(()=>{h.el.classList.remove('hit');},150);
  // score pop
  showPop(h.el,'+'+pts,h.gold?'#ffdd00':'#00ff41');
}

function showPop(el,txt,color){
  const p=document.createElement('div');
  p.textContent=txt;
  p.style.cssText=`position:absolute;top:20%;left:50%;transform:translateX(-50%);
    font-size:clamp(16px,4vw,24px);font-weight:bold;color:${color};
    text-shadow:0 0 10px ${color};pointer-events:none;z-index:10;
    animation:popUp .6s forwards;`;
  if(!document.getElementById('popstyle')){
    const s=document.createElement('style');
    s.id='popstyle';
    s.textContent='@keyframes popUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}';
    document.head.appendChild(s);
  }
  el.appendChild(p);
  setTimeout(()=>p.remove(),600);
}

function endGame(){
  run=false; clearInterval(timerLoop);
  holes.forEach(h=>{h.mole.classList.remove('up','bonked');clearTimeout(h.timer);});
  if(score>hi){hi=score;localStorage.setItem('wh_hi',hi);document.getElementById('hi').textContent=hi;}
  document.querySelector('.ov-t').textContent='-- BRAVISSIMO! --';
  document.querySelector('.ov-s').textContent='PUNTEGGIO: '+score+'   RECORD: '+hi;
  document.querySelector('.big-btn').textContent='RIGIOCA';
  document.getElementById('ov').style.display='flex';
}
</script>
</body>
</html>
