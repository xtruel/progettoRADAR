<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BREAKOUT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#000;color:#00ff41;font-family:'Courier New',monospace;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
#hdr{display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:1px solid rgba(0,255,65,.25);flex-shrink:0;}
.hbtn{background:none;border:1px solid rgba(0,255,65,.4);color:#00ff41;
  font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;
  padding:8px 14px;border-radius:4px;cursor:pointer;}
.hbtn:active{background:rgba(0,255,65,.2);}
#sval{font-size:clamp(20px,5vw,34px);font-weight:bold;text-shadow:0 0 10px #00ff41;}
#main{flex:1;position:relative;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;}
.ov-t{font-size:clamp(22px,6vw,42px);font-weight:bold;letter-spacing:4px;text-shadow:0 0 18px #00ff41;}
.ov-s{font-size:clamp(12px,2.5vw,16px);opacity:.6;letter-spacing:2px;}
.big-btn{background:rgba(0,255,65,.1);border:3px solid #00ff41;color:#00ff41;
  font-family:'Courier New',monospace;font-size:clamp(16px,4vw,24px);font-weight:bold;
  letter-spacing:4px;padding:16px 44px;border-radius:8px;cursor:pointer;
  text-shadow:0 0 10px #00ff41;box-shadow:0 0 18px rgba(0,255,65,.3);}
.big-btn:active{background:rgba(0,255,65,.3);transform:scale(.96);}
</style>
</head>
<body>
<div id="hdr">
  <button class="hbtn" onclick="location.href='radar_control.html'">RADAR</button>
  <div style="text-align:center">
    <div style="font-size:10px;opacity:.45;letter-spacing:3px">PUNTEGGIO</div>
    <div id="sval">0</div>
  </div>
  <div style="text-align:right;font-size:11px;opacity:.45">
    VITE <span id="lives">3</span><br>
    REC <span id="hi">0</span>
  </div>
</div>
<div id="main">
  <canvas id="cv"></canvas>
  <div id="ov">
    <div class="ov-t">-- BREAKOUT --</div>
    <div class="ov-s">Rompi tutti i mattoni!<br>Trascina o muovi il mouse</div>
    <button class="big-btn" onclick="startGame()">GIOCA</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,ball,paddle,bricks,score,lives,run=false,raf,last=0;
let hi=+localStorage.getItem('bo_hi')||0;
let touchPX=null;
document.getElementById('hi').textContent=hi;

const ROWS=5,GAP=4;
const BRICK_COLORS=['#ff3333','#ff8800','#ffff00','#00ff41','#00aaff'];

function resize(){
  const m=document.getElementById('main');
  W=cv.width=m.clientWidth;H=cv.height=m.clientHeight;
}

function startGame(){
  document.getElementById('ov').style.display='none';
  resize();
  score=0;lives=3;
  document.getElementById('sval').textContent=0;
  document.getElementById('lives').textContent=3;
  initBricks();
  const PW=Math.min(100,W*.25);
  paddle={x:W/2-PW/2,y:H-30,w:PW,h=12,speed:0};
  ball={x:W/2,y:H-60,r:7,vx:3.5,vy:-4.5,trail:[]};
  run=true;
  cancelAnimationFrame(raf);last=performance.now();
  raf=requestAnimationFrame(loop);
}

function initBricks(){
  const cols=10;
  const bw=(W-GAP*(cols+1))/cols;
  bricks=[];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<cols;c++){
      bricks.push({x:GAP+(bw+GAP)*c,y:50+GAP+(bw*.4+GAP)*r,w:bw,h:bw*.4,color:BRICK_COLORS[r],alive:true});
    }
  }
}

function loop(ts){
  if(!run)return;
  const dt=Math.min((ts-last)/16,3);last=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}

function update(dt){
  // move paddle toward touch
  if(touchPX!==null){
    const dx=touchPX-paddle.x-paddle.w/2;
    if(Math.abs(dx)>2)paddle.x+=Math.sign(dx)*Math.min(Math.abs(dx),10*dt);
  }
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  // trail
  ball.trail.push({x:ball.x,y:ball.y});
  if(ball.trail.length>6)ball.trail.shift();

  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  // walls
  if(ball.x-ball.r<=0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r>=W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
  if(ball.y-ball.r<=0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

  // paddle
  if(ball.vy>0&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&
     ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h){
    ball.y=paddle.y-ball.r;
    const rel=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=rel*7;
    ball.vy=-Math.abs(ball.vy)*1.01;
    if(Math.abs(ball.vx)<1)ball.vx=ball.vx<0?-1:1;
  }

  // bricks
  bricks.forEach(b=>{
    if(!b.alive)return;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;
      score+=10;
      document.getElementById('sval').textContent=score;
      // which side
      const fromLeft=Math.abs((ball.x+ball.r)-b.x);
      const fromRight=Math.abs((ball.x-ball.r)-(b.x+b.w));
      const fromTop=Math.abs((ball.y+ball.r)-b.y);
      const fromBot=Math.abs((ball.y-ball.r)-(b.y+b.h));
      const mn=Math.min(fromLeft,fromRight,fromTop,fromBot);
      if(mn===fromTop||mn===fromBot)ball.vy*=-1;else ball.vx*=-1;
    }
  });

  // ball lost
  if(ball.y>H+20){
    lives--;
    document.getElementById('lives').textContent=lives;
    if(lives<=0){end(false);return;}
    ball={x:W/2,y:H-60,r:7,vx:3.5*(Math.random()>.5?1:-1),vy:-4.5,trail:[]};
    paddle.x=W/2-paddle.w/2;
  }

  // all bricks cleared
  if(bricks.every(b=>!b.alive)){
    score+=lives*50;
    end(true);
  }
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // bricks
  bricks.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.color;ctx.shadowBlur=6;ctx.shadowColor=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.shadowBlur=0;
  });
  // trail
  ball.trail.forEach((t,i)=>{
    ctx.globalAlpha=(i/ball.trail.length)*0.25;
    ctx.fillStyle='#00ff41';
    ctx.beginPath();ctx.arc(t.x,t.y,ball.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // ball
  ctx.shadowBlur=14;ctx.shadowColor='#00ff41';ctx.fillStyle='#00ff41';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // paddle
  ctx.shadowBlur=10;ctx.shadowColor='#00ff41';ctx.fillStyle='#00ff41';
  ctx.beginPath();
  ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);
  ctx.fill();ctx.shadowBlur=0;
}

function end(win){
  run=false;cancelAnimationFrame(raf);
  if(score>hi){hi=score;localStorage.setItem('bo_hi',hi);document.getElementById('hi').textContent=hi;}
  document.querySelector('.ov-t').textContent=win?'-- BRAVO! --':'-- FINE --';
  document.querySelector('.ov-s').textContent='PUNTEGGIO: '+score+'   RECORD: '+hi;
  document.querySelector('.big-btn').textContent='RIGIOCA';
  document.getElementById('ov').style.display='flex';
}

// Controls
cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  touchPX=(e.clientX-rect.left)*(W/rect.width);
});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  touchPX=e.touches[0].clientX;
},{passive:false});
cv.addEventListener('touchstart',e=>{
  touchPX=e.touches[0].clientX;
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')touchPX=(touchPX||W/2)-15;
  if(e.key==='ArrowRight')touchPX=(touchPX||W/2)+15;
});
</script>
</body>
</html>
